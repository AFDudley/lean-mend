pebble_id: lea-c87
summary: >
  LeanMend/Shell/Driver.lean now mends every current frontier module of a
  wave at the same time, instead of one module at a time. For the `.built`
  state with a non-empty frontier, the driver creates one `git worktree add
  --detach` attempt worktree per wave member, then runs `planWaveModule` as
  one background task per member (`IO.asTask`): it diagnoses the module
  inside its own worktree and plans the module's whole round sequence
  (`planModule`), deciding each accept/reject/give-up with `Mending.step`
  exactly as a live run would, but writing no ledger line and making no
  mend-branch commit. The driver then replays every member's plan — one
  member at a time, in the wave's own canonical (module topological) order,
  the same order `frontier` already returns — against the shared `RunState`
  and ledger (`replayDiagnosed`, `replayRounds`), applying and committing
  each accepted candidate on the main checkout only there. So the ledger and
  the mend-branch commits come out in the same order a one-module-at-a-time
  run would write them, no matter which member's worktree finishes first,
  and only the driver ever edits the main checkout or commits to it.
  `consumeSpeculation` is now `speculateRounds`: it returns the speculative
  round data (plus the `speculateAttempt`/`speculateResult` ledger lines
  `tests/speculate.sh` already checks for) instead of writing the ledger and
  committing directly, so `--speculate n > 1` replays the same way a plain
  attempt round does. `attemptOne` takes a new optional `followedSnapshot`,
  read once before a wave starts, so every member of the wave plans against
  the same snapshot of accepted-body-rule names rather than racing a live
  `IO.Ref` read against another member's mid-wave accept.

  A `git worktree add` checkout holds every Lake package's tracked source
  but none of their untracked build output. `LeanMend/Shell/Target.lean`
  gained `nestedPackageRoots` (every nested Lake package directory, the
  existing `sourceFiles` nested-package test, reused), and Driver.lean's new
  `symlinkLakeDirs` uses it to symlink each package's own `.lake` directory,
  including the root package's, back to the main checkout's — `diagnose` and
  `attemptOne` only ever read it through `LEAN_PATH`; `buildAll`, the only
  writer, always runs against the main checkout directly, never inside a
  worktree. Without this link, `tests/rename.sh`, `tests/simpset.sh` and
  `tests/move.sh` (each with a path dependency) failed inside a wave
  worktree with "unknown module prefix" — caught by running the full
  existing suite, not just the new fixture. A second, independent bug the
  same full-suite run caught: the plain (`--speculate <= 1`) attempt path
  inside `planModule` reused one worktree across a module's several
  attempts but, unlike the sequential code it replaced, never reverted a
  rejected candidate's edit before the next one; fixed by restoring the
  saved bytes on a non-accept, as the sequential loop always did.

  No file under LeanMend/Spec or LeanMend/Core changed; this slice is
  entirely in the Shell plus `scripts/gate.sh` and the new `tests/fleet.sh`
  fixture.
