summary: >
  Implemented S4 of docs/parallel.md (decisions P14-P16): lean-mend can now
  attempt the next N head candidates of a stubborn site at the same time,
  each in its own git worktree, while the Core still commits the first
  candidate that passes in rule order, never the first worktree to finish.
  LeanMend/Core/Mend.lean gained `Mending.speculate` (the next n head
  candidates, in rule order) and the proved theorem
  `Mending.speculate_prefix` (it is a prefix of the head site's candidate
  list, via Lean core's `List.take_prefix`, so the speculative order is the
  rule order). `Mending.step` itself is unchanged; `Mending.step_measure`
  already covers every call the new path makes. LeanMend/Shell/Driver.lean
  gained a `--speculate <n>` flag (default 1, unchanged behavior) threaded
  through Main.lean and Ctx. The old single-attempt code was factored,
  behavior-preserving, into `attemptOne` (apply + rebuild one candidate
  against any target directory) and `commitAccepted` (the accept-side
  effects and the mend-branch commit), reused by both the default path and
  the new one. The new `--speculate n > 1` path creates n worktrees
  (serialized, since `git worktree add` writes shared `.git/worktrees`
  metadata), runs `attemptOne` in each on a dedicated OS thread
  (`IO.asTask ... Task.Priority.dedicated`) so every rebuild runs at the
  same time, then `consumeSpeculation` replays the verdicts into
  `Mending.step` one at a time in rule order (a reject for every candidate
  that failed, then the accept), applies the winner to the main checkout
  and commits it there, and the driver removes every attempt worktree
  afterward. A verdict that is neither a plain accept nor a plain reject
  (a cleaning) stops the batch early rather than feeding it a mismatched
  precomputed result, and the ordinary loop resumes at the new head.
  tests/fixtures/speculate has one open site with three rule-ordered
  candidates: the first two leave the site open and add a slow `decide`
  over a large plain-recursive count (not one of Lean's accelerated `Nat`
  operations), so their own rebuild takes several seconds longer; the third
  fixes the site and is fast. tests/speculate.sh runs the fixture once with
  `--speculate 3` and once with no flag, reads the first run's ledger for
  the concurrency and finish-order facts (speculateRound/speculateAttempt/
  speculateResult/speculateCleanup entries the driver now appends), and
  reads each run's one mend-branch commit by grepping its diff for each
  candidate's known replacement text. I verified it directly: in three
  manual runs the three candidates always started together, the third
  (fast) candidate always finished first by roughly 15-18x (around 270ms
  against roughly 4.3-4.9s), and the Core always committed the third
  candidate, matching a sequential run of the same fixture, with zero
  leftover worktrees or uncommitted files afterward. I also found and
  fixed a pre-existing "Mathlib" mention in a Shell/Driver.lean docstring
  (unrelated to this change, just an example in `prepareTree`'s comment)
  that would otherwise have failed acceptance clause c6's literal grep,
  since it names LeanMend/Shell/Driver.lean as one of the three files that
  must not mention Mathlib. Wired tests/speculate.sh into scripts/gate.sh
  as the step "speculation across candidates" and ran the full gate
  (15/15 steps, including every pre-existing fixture) to confirm no
  regression from the attemptOne/commitAccepted refactor of the default
  path.
