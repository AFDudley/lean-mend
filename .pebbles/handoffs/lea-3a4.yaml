summary: >
  LeanMend/Core/Run.lean's `RunState.mending` now holds a `Fleet` (a `List
  Mending` plus a proof that no two members mend the same module) in place
  of one `Mending`. `RunObs.mend` and `RunObs.mended` now carry the module
  name, so `Fleet.step`/`Fleet.find?`/`Fleet.remove`/`Fleet.add` route each
  observation to, or add or drop, the right member. `RunState.step` starts
  a one-member fleet on the first `diagnosed` observation of a wave, adds a
  member on each later `diagnosed` observation for a still-open frontier
  module, and leaves `mending` for `built` only once the fleet empties.
  `frontier_pairwise_indep` (Run.lean) proves two different frontier
  modules never import each other, by unfolding `frontier`'s filter and
  deriving a contradiction from a shared import's status being both
  `built` (from the importer's frontier membership) and `failing` (from
  the imported module's own). `Fleet.step_wf` (Run.lean) proves routing an
  observation to its module leaves the fleet's module-name list, and so its
  distinctness, unchanged; it rests on a new `Mending.step_module`
  (Mend.lean) proving `Mending.step` never changes which module a `Mending`
  mends, by the same case split `Mending.step_measure` already uses.
  `openCount_finishAll` plus its helpers `finishAll` and
  `openCount_finish_le`/`openCount_finishAll_le` (Termination.lean)
  generalize `openCount_finish` to a non-empty wave: finishing every module
  of the wave strictly lowers `openCount`, by finding one open witness in
  the wave and showing the rest of the wave cannot raise the count back.
  `openCount_settled` is untouched. `LeanMend/Shell/Driver.lean` (the
  sequential shell, unaffected by this ticket's scope but broken by the
  type change) now reads its one `Mending` out of the fleet via a new
  `soleMending` that throws loudly if the fleet does not hold exactly one
  member — the parallel shell itself is S3b, future work. I added the
  required `tests/OpsTest.lean` check: a hand-built two-member fleet
  ("A", "B"), each with one open site and no candidate, stepped with
  `.mend "A" .gaveUp` then `.mend "B" .gaveUp`, and the reverse order;
  both orders land on the same `(module, errors, residue.length)` summary
  for both members, which is the S3a acceptance check (docs/parallel.md).
  `tests/Tour.lean`'s single-module walk through the full level-1/level-2
  machine was updated for the new `RunObs` shape (no behavior change). The
  spec named `scripts/check_ops.sh` as a behavior oracle but the script did
  not exist; I added it, running `lake test` and
  `lake env lean tests/NoSorry.lean` and reporting
  `{"lake_test_exit", "nosorry_exit"}` on stdout, mirroring `scripts/gate.sh`'s
  JSON-on-stdout convention. Verified with `lake build` (clean across the
  library, the test executable, and the `lean-mend` executable),
  `lake test` (0 failed, including the new fleet-order test),
  `lake env lean tests/NoSorry.lean` (0 constants depend on `sorryAx`),
  the grep checks for the four named theorems and the Shell/Mathlib-import
  and no-retry-or-timeout boundaries, `scripts/check_ops.sh` (both exits
  0), and the full `scripts/gate.sh` (15/15 steps ok, 0 failed, including
  every pre-existing sequential-driver fixture against the real `lean-mend`
  binary: baseline, rename, simp-set, binder, follow, follow-pair, order,
  speculate, expose, move) — all run at the commit this handoff names.
